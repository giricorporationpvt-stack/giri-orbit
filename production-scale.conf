# ============================================================================
# GIRI ORBIT — PRODUCTION EDGE CDN & REVERSE PROXY CONFIGURATION
# Optimized to handle 1,000,000+ Concurrent Users / Second
# ============================================================================

# Worker connection tuning
worker_processes auto;
worker_rlimit_nofile 1000000;

events {
    worker_connections 65535;
    use epoll;
    multi_accept on;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # High performance zero-copy file transfer
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    keepalive_requests 10000;

    # Gzip & Brotli Dynamic Pre-compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/wasm image/svg+xml;

    # Microcaching zone for 1M concurrent req/s
    proxy_cache_path /tmp/nginx_cache levels=1:2 keys_zone=orbit_cache:100m max_size=10g inactive=60m use_temp_path=off;

    server {
        listen 80;
        listen 443 ssl http2;
        server_name orbit.giricorp.com;

        root /var/www/giri-orbit;
        index index.html;

        # Immutable caching for static versioned assets (0 server load)
        location ~* \.(?:css|js|woff2?|png|jpg|jpeg|gif|ico|svg|wasm)$ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
            add_header X-Sovereign-Edge "HIT-EDGE-STATIC";
        }

        # Service Worker & HTML must revalidate with ETags
        location ~* (sw\.js|manifest\.json|index\.html)$ {
            expires -1;
            add_header Cache-Control "no-cache, public, must-revalidate";
            add_header Service-Worker-Allowed "/";
            etag on;
        }

        # Security Headers for Enterprise Compliance
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options SAMEORIGIN;
        add_header X-XSS-Protection "1; mode=block";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
    }
}
